<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#213229"/>
      <stop offset="100%" stop-color="#121D18"/>
    </linearGradient>
    <linearGradient id="wAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B07246"/>
      <stop offset="100%" stop-color="#734220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#gAbout)"/>
  
  <!-- Linhas arquitetônicas do pátio e galpão de madeiras -->
  <polygon points="100,700 400,200 700,700" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  <line x1="400" y1="200" x2="400" y2="700" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Lotes de vigas organizadas no pátio -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="440" height="35" fill="url(#wAbout)" rx="2"/>
    <rect x="20" y="45" width="400" height="35" fill="url(#wAbout)" rx="2"/>
    <rect x="40" y="90" width="360" height="35" fill="url(#wAbout)" rx="2"/>
    <rect x="60" y="135" width="320" height="35" fill="url(#wAbout)" rx="2"/>
    <rect x="80" y="180" width="280" height="35" fill="url(#wAbout)" rx="2"/>
  </g>

  <!-- Tag técnica de identificação -->
  <rect x="60" y="60" width="380" height="80" rx="4" fill="rgba(24,25,27,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="80" y="95" fill="#F8F7F4" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="2">AVENIDA MADEIRAS</text>
  <text x="80" y="120" fill="#8D5B36" font-family="'Inter', sans-serif" font-size="12">Pátio e Depósito • Taiobeiras - MG</text>
</svg>
