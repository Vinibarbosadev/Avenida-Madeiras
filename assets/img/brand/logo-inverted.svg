<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="100%" height="100%" fill="none">
  <!-- SÍMBOLO ARQUITETÔNICO A-M (ISOTIPO DUPLA LINHA / VERSÃO INVERTIDA BRANCA) -->
  <g class="brand-symbol" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Estrutura Superior 'A' (Tesoura / Frontão) -->
    <!-- Linha Externa A -->
    <path d="M 18 100 L 58 14 L 98 100" />
    <!-- Linha Interna A -->
    <path d="M 28 92 L 58 28 L 88 92" />
    
    <!-- Estrutura Intertravada 'M' (Montante / Miter Base) -->
    <!-- Linha Externa M -->
    <path d="M 6 100 L 26 56 L 58 92 L 90 56 L 110 100" />
    <!-- Linha Interna M -->
    <path d="M 16 100 L 32 66 L 58 98 L 84 66 L 100 100" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFIA SERIFADA CLÁSSICA -->
  <!-- Linha 1: AVENIDA -->
  <text x="122" y="52" 
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="0.12em" 
        fill="#FFFFFF">
    AVENIDA
  </text>
  
  <!-- Linha 2: MADEIRAS -->
  <text x="122" y="94" 
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
        font-size="33" 
        font-weight="700" 
        letter-spacing="0.08em" 
        fill="#FFFFFF">
    MADEIRAS
  </text>
</svg>
