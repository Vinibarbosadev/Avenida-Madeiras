<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F3338"/>
      <stop offset="100%" stop-color="#151719"/>
    </linearGradient>
    <linearGradient id="w2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C58557"/>
      <stop offset="100%" stop-color="#7B4722"/>
    </linearGradient>
  </defs>
  <rect width="600" height="375" fill="url(#g2)"/>
  <!-- Armação de telhado / caibros e ripas em corte -->
  <line x1="50" y1="320" x2="300" y2="100" stroke="url(#w2)" stroke-width="14" stroke-linecap="round"/>
  <line x1="550" y1="320" x2="300" y2="100" stroke="url(#w2)" stroke-width="14" stroke-linecap="round"/>
  <line x1="120" y1="260" x2="480" y2="260" stroke="url(#w2)" stroke-width="10"/>
  <line x1="300" y1="100" x2="300" y2="260" stroke="#B07246" stroke-width="8"/>
  
  <!-- Ripamento transversal -->
  <line x1="100" y1="160" x2="500" y2="160" stroke="#8D5B36" stroke-width="4" stroke-dasharray="8 4"/>
  <line x1="80" y1="210" x2="520" y2="210" stroke="#8D5B36" stroke-width="4" stroke-dasharray="8 4"/>

  <text x="30" y="45" fill="#E5E2DB" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="2">CAIBROS &amp; COBERTURAS</text>
  <text x="30" y="65" fill="#8D5B36" font-family="'Inter', sans-serif" font-size="11" letter-spacing="1">Telhados coloniais, metálicos e telhas de concreto</text>
</svg>
