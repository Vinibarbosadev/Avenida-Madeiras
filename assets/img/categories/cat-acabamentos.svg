    <rect x="238" y="0" width="22" height="230" rx="1" fill="url(#deck)"/>
    <rect x="272" y="0" width="22" height="230" rx="1" fill="url(#deck)"/>
    <rect x="306" y="0" width="22" height="230" rx="1" fill="url(#deck)"/>
